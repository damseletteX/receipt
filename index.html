<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Реквизиты для оплаты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

  :root{
    --paper:      #faf6f1;
    --paper-card: #fffdfb;
    --ink:        #4a3226;
    --ink-soft:   #93765f;
    --gold:       #2f9c92;
    --teal-soft:  #e3f1ef;
    --line:       #e9decf;
    --shadow:     rgba(74, 50, 38, 0.14);
    color-scheme: light;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    min-height:100%;
    overscroll-behavior-y: none;
  }

  body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:
      calc(env(safe-area-inset-top, 0px) + 28px)
      calc(env(safe-area-inset-right, 0px) + 16px)
      calc(env(safe-area-inset-bottom, 0px) + 40px)
      calc(env(safe-area-inset-left, 0px) + 16px);
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 8%, rgba(47,156,146,0.10), transparent 45%),
      radial-gradient(circle at 85% 92%, rgba(74,50,38,0.05), transparent 40%),
      var(--paper);
  }

  .page{
    width:100%;
    max-width:440px;
  }

  .eyebrow{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 10px;
    opacity:0;
    animation: fadeUp .6s ease forwards;
    animation-delay:.05s;
  }

  h1{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-style:italic;
    font-size:clamp(30px, 7.6vw, 40px);
    line-height:1.18;
    margin:0 0 28px;
    color:var(--ink);
    opacity:0;
    animation: fadeUp .6s ease forwards;
    animation-delay:.12s;
  }

  .receipt-wrap{
    opacity:0;
    transform:translateY(-14px);
    animation: printIn .7s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay:.22s;
  }

  .tear{
    height:12px;
    background:
      linear-gradient(-45deg, var(--paper) 8px, transparent 0),
      linear-gradient(45deg, var(--paper) 8px, transparent 0);
    background-size:16px 16px;
    background-position: left top;
    background-color: var(--paper-card);
  }
  .tear.top{ border-radius: 2px 2px 0 0; }
  .tear.bottom{ transform: scaleY(-1); }

  .receipt{
    background:var(--paper-card);
    box-shadow: 0 24px 48px -18px var(--shadow), 0 2px 8px rgba(74,50,38,0.06);
    padding: 4px 26px 6px;
  }

  .recipient{
    text-align:center;
    padding: 18px 4px 20px;
    border-bottom: 1px dashed var(--line);
  }

  .recipient .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 8px;
  }

  .recipient .name{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:23px;
    line-height:1.3;
    margin:0;
    color:var(--ink);
  }

  .rows{ padding: 4px 0 16px; }

  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:14px 2px;
    border-bottom:1px dashed var(--line);
    opacity:0;
    animation: fadeUp .5s ease forwards;
  }
  .row:last-child{ border-bottom:none; }

  .row .text{ min-width:0; flex:1; }

  .row .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 4px;
  }

  .row .value{
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    letter-spacing:.01em;
    color:var(--ink);
    margin:0;
    word-break:break-word;
  }

  .copy-btn{
    flex-shrink:0;
    width:40px; height:40px;
    min-width:44px; min-height:44px;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    border:1px solid var(--line);
    border-radius:10px;
    cursor:pointer;
    color:var(--ink-soft);
    transition: background .25s ease, border-color .25s ease, color .25s ease, transform .15s ease;
    touch-action: manipulation;
    -webkit-appearance:none;
    appearance:none;
    position:relative;
  }
  .copy-btn:active{ transform: scale(0.92); }
  .copy-btn.copied{
    background: var(--accent);
    border-color: var(--accent);
    color:#fff;
  }
  .copy-btn svg{ width:17px; height:17px; display:block; }
  .copy-btn .icon-check{ display:none; }
  .copy-btn.copied .icon-copy{ display:none; }
  .copy-btn.copied .icon-check{ display:block; }

  .purpose{
    padding: 16px 2px 20px;
    text-align:center;
  }
  .purpose .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  .purpose .value{
    font-family:'Manrope', sans-serif;
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.5;
    margin:0;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color:#fff;
    font-family:'Manrope', sans-serif;
    font-size:13.5px;
    font-weight:500;
    padding:11px 20px;
    border-radius:100px;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
    box-shadow: 0 12px 24px rgba(74,50,38,0.25);
    white-space:nowrap;
    z-index:10;
  }
  .toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }

  .footnote{
    text-align:center;
    margin-top:22px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.08em;
    color:var(--ink-soft);
    opacity:.55;
  }

  .calc-wrap{
    margin-top:22px;
    opacity:0;
    transform:translateY(10px);
    animation: fadeUp .6s ease forwards;
    animation-delay:.7s;
  }

  .calc{
    background:var(--paper-card);
    border-radius:14px;
    box-shadow: 0 18px 36px -20px var(--shadow), 0 2px 8px rgba(74,50,38,0.05);
    padding: 20px 22px 22px;
  }

  .calc-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 14px;
    text-align:center;
  }

  .calc-field{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .calc-field label{
    font-family:'Manrope', sans-serif;
    font-size:13.5px;
    color:var(--ink-soft);
    flex-shrink:0;
  }

  .calc-input-box{
    position:relative;
    flex:1;
    display:flex;
    align-items:center;
  }

  .calc-input-box input{
    width:100%;
    min-height:44px;
    font-family:'IBM Plex Mono', monospace;
    font-size:16px;
    color:var(--ink);
    background: var(--teal-soft);
    border: 1px solid transparent;
    border-radius:10px;
    padding: 10px 44px 10px 14px;
    outline:none;
    transition: border-color .2s ease, background .2s ease;
    -webkit-appearance:none;
    appearance:none;
  }

  .calc-input-box input::placeholder{ color:var(--ink-soft); opacity:.6; }

  .calc-input-box input:focus{
    border-color: var(--accent);
    background:#fff;
  }

  .calc-input-box .unit{
    position:absolute;
    right:14px;
    font-family:'Manrope', sans-serif;
    font-size:12.5px;
    color:var(--ink-soft);
    pointer-events:none;
  }

  .calc-divider{
    border:none;
    border-top:1px dashed var(--line);
    margin:18px 0 16px;
  }

  .calc-result{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }

  .calc-result .rlabel{
    font-family:'Manrope', sans-serif;
    font-size:13.5px;
    color:var(--ink-soft);
  }

  .calc-result .rvalue{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:30px;
    color:var(--ink);
    transition: color .2s ease;
  }

  .calc-result .rvalue.pulse{
    color:var(--accent);
  }

  .calc-rate{
    text-align:center;
    margin-top:10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    color:var(--ink-soft);
    opacity:.6;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes printIn{
    from{ opacity:0; transform:translateY(-14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001s !important; animation-delay:0s !important; transition-duration:0.001s !important; }
  }
</style>
</head>
<body>

  <div class="page">
    <p class="eyebrow">К оплате</p>
    <h1>Реквизиты для перевода</h1>

    <div class="receipt-wrap">
      <div class="tear top"></div>
      <div class="receipt">

        <div class="recipient">
          <p class="label">Получатель</p>
          <p class="name" id="recipientName">Гарбар А******** Е*******</p>
        </div>

        <div class="rows" id="rows"></div>

        <div class="purpose" id="purposeBlock">
          <p class="label">Назначение платежа</p>
          <p class="value" id="purposeValue">Приходи ко мне еще!</p>
        </div>

      </div>
      <div class="tear bottom"></div>
    </div>

    <div class="calc-wrap">
      <div class="calc">
        <p class="calc-title">Расчёт стоимости</p>

        <div class="calc-field">
          <label for="sheetsInput">Количество листов</label>
          <div class="calc-input-box">
            <input type="number" id="sheetsInput" inputmode="numeric" min="0" step="1" placeholder="0">
            <span class="unit">шт.</span>
          </div>
        </div>

        <hr class="calc-divider">

        <div class="calc-result">
          <span class="rlabel">Итого к оплате</span>
          <span class="rvalue" id="calcResult">0,00 ₽</span>
        </div>

        <p class="calc-rate">1 лист = 0,40 ₽</p>
      </div>
    </div>

    <p class="footnote">Нажмите на поле, чтобы скопировать</p>
  </div>

  <div class="toast" id="toast">Скопировано</div>

<script>
  const DATA = {
    recipient: "Г***** А******** Е********",
    fields: [
      { label: "IBAN (ерип альфа-банк)", value: "BY48ALFA3014325UXH0010270000" },
      { label: "Альфа-банк",       value: "5208 1300 0620 0962" },
      { label: "Номер счёта (ерип белинвест)",           value: "BY66BLBB30341200000009748108" },
      { label: "Номер договора \n (ерип белинвест)",                   value: "90kBYN-FEA4DC" },
    ],
    purpose: "Приходи ко мне ещё!"
  };

  const PRICE_PER_SHEET = 0.4;

  document.getElementById('recipientName').textContent = DATA.recipient;


  const purposeBlock = document.getElementById('purposeBlock');
  const purposeValue = document.getElementById('purposeValue');
  if (DATA.purpose && DATA.purpose.trim().length){
    purposeValue.textContent = DATA.purpose;
  } else {
    purposeBlock.style.display = 'none';
  }

  const rowsEl = document.getElementById('rows');
  const toastEl = document.getElementById('toast');
  let toastTimer = null;

  const iconCopy = `<svg viewBox="0 0 24 24" fill="none" class="icon-copy"><rect x="8" y="8" width="12" height="12" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M16 8V6.5C16 5.67157 15.3284 5 14.5 5H6.5C5.67157 5 5 5.67157 5 6.5V14.5C5 15.3284 5.67157 16 6.5 16H8" stroke="currentColor" stroke-width="1.6"/></svg>`;
  const iconCheck = `<svg viewBox="0 0 24 24" fill="none" class="icon-check"><path d="M5 12.5L10 17.5L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  DATA.fields.forEach((f, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.animationDelay = (0.32 + i * 0.06) + 's';
    row.innerHTML = `
      <div class="text">
        <p class="label">${f.label}</p>
        <p class="value">${f.value}</p>
      </div>
      <button class="copy-btn" type="button" aria-label="Скопировать ${f.label}">
        ${iconCopy}${iconCheck}
      </button>
    `;
    const btn = row.querySelector('.copy-btn');
    btn.addEventListener('click', () => copyValue(f.value, btn, f.label));
    rowsEl.appendChild(row);
  });

  function showToast(text){
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }

  function copyValue(text, btn, label){
    const done = () => {
      btn.classList.add('copied');
      showToast('Скопировано: ' + label);
      setTimeout(() => btn.classList.remove('copied'), 1400);
    };

    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, cb){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
    cb();
  }

  const sheetsInput = document.getElementById('sheetsInput');
  const calcResult = document.getElementById('calcResult');

  function formatRub(num){
    return num.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' \u20BD';
  }

  function updateCalc(){
    const raw = sheetsInput.value.replace(',', '.');
    const sheets = Math.max(0, parseFloat(raw) || 0);
    const total = sheets * PRICE_PER_SHEET;
    calcResult.textContent = formatRub(total);
    calcResult.classList.add('pulse');
    clearTimeout(updateCalc._t);
    updateCalc._t = setTimeout(() => calcResult.classList.remove('pulse'), 300);
  }

  sheetsInput.addEventListener('input', updateCalc);
</script>

</body>
</html>
